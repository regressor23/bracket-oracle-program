[package]
name = "bracket-oracle"
version = "0.1.0"
description = "Bracket Oracle on-chain program: USDC pools, entries and settlement"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "bracket_oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "1.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
