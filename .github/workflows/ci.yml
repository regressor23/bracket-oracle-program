name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Engine and verify CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Program checks (host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  anchor:
    name: Anchor build (SBF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGAVE_VERSION: v4.1.2
      ANCHOR_VERSION: 1.2.1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}
      - name: Install Agave (Solana CLI)
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        run: npm install -g @anchor-lang/cli@${ANCHOR_VERSION}
      - run: solana --version && anchor --version
      - name: Build program
        run: anchor build
      - run: pnpm install --frozen-lockfile
      # anchor test starts solana-test-validator with the program at the address from
      # Anchor.toml and runs tests/ against it; the wallet is a throwaway funded at genesis.
      - name: Test the program on a local validator
        run: |
          solana-keygen new --no-bip39-passphrase --silent --outfile "$RUNNER_TEMP/test-wallet.json"
          anchor test --skip-build --validator legacy --provider.wallet "$RUNNER_TEMP/test-wallet.json"
      - name: Upload program and IDL
        uses: actions/upload-artifact@v4
        with:
          name: bracket-oracle-program
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
